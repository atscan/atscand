database:
  path: "atscan.db"
  type: "sqlite"

plc:
  directory_url: "https://plc.directory"
  scan_interval: "6h"
  batch_size: 1000
  cache_dir: "./plc_cache"    # Cache directory
  use_cache: true             # Enable caching

pds:
  scan_interval: "15m"
  timeout: "30s"
  workers: 10
  recheck_interval: "5m"

api:
  host: "0.0.0.0"
  port: 8080
